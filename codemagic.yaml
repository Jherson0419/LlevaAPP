workflows:
  ios-release:
    name: Lleva iOS - TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pe.lleva.app"
        APP_STORE_APPLE_ID: "6817361943"
      groups:
        - Secretas
    scripts:
      - name: Set up .env file
        script: |
          python3 << 'PYEOF'
          import os
          lines = [
            f"SUPABASE_URL={os.environ['SUPABASE_URL']}",
            f"SUPABASE_ANON_KEY={os.environ['SUPABASE_ANON_KEY']}",
            f"GOOGLE_MAPS_KEY={os.environ['GOOGLE_MAPS_KEY']}",
            f"GOOGLE_WEB_CLIENT_ID={os.environ['GOOGLE_WEB_CLIENT_ID']}",
            f"SUPABASE_REDIRECT_URL={os.environ['SUPABASE_REDIRECT_URL']}",
            "DEV_MODE=false",
          ]
          with open(".env", "w") as f:
              f.write("\n".join(lines) + "\n")
          print(".env generado correctamente")
          with open(".env") as f:
              for line in f:
                  key = line.split("=")[0]
                  val = line.split("=",1)[1].strip() if "=" in line else ""
                  print(f"{key}={val[:15]}...")
          PYEOF

      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up keychain
        script: keychain initialize

      - name: Generate RSA 2048 key for certificate
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --issuer-id=$APP_STORE_CONNECT_ISSUER_ID \
            --key-id=$APP_STORE_CONNECT_KEY_IDENTIFIER \
            --create \
            --strict-match-identifier

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up Xcode project signing
        script: xcode-project use-profiles

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Set up GoogleService-Info.plist
        script: |
          # Está en .gitignore: se crea desde la variable secreta (grupo
          # Secretas). Sin ella, FirebaseApp.configure() cerraría la app.
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "Falta la variable GOOGLE_SERVICE_INFO_PLIST" >&2
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
          plutil -lint "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Set up env_defaults.dart
        script: |
          python3 << 'PYEOF'
          import os, textwrap
          supabase_url = os.environ["SUPABASE_URL"]
          supabase_anon_key = os.environ["SUPABASE_ANON_KEY"]
          google_web_client_id = os.environ["GOOGLE_WEB_CLIENT_ID"]

          print(f"SUPABASE_URL: {supabase_url[:20]}...")
          print(f"SUPABASE_ANON_KEY: {supabase_anon_key[:20]}...")
          print(f"GOOGLE_WEB_CLIENT_ID: {google_web_client_id[:20]}...")

          lines = [
            "// Generado por Codemagic — no commitear",
            "class EnvDefaults {",
            f"  static const supabaseUrl = '{supabase_url}';",
            f"  static const supabaseAnonKey = '{supabase_anon_key}';",
            f"  static const googleWebClientId = '{google_web_client_id}';",
            "}",
          ]
          content = "\n".join(lines) + "\n"

          path = os.environ["CM_BUILD_DIR"] + "/lib/core/constants/env_defaults.dart"
          with open(path, "w") as f:
              f.write(content)

          print("env_defaults.dart generado:")
          print(content)
          PYEOF

      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --dart-define-from-file=.env \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false