workflows:
  ios-release:
    name: Lleva iOS - TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pe.lleva.app"
        APP_STORE_APPLE_ID: "6817361943"
      groups:
        - Secretas
    scripts:
      - name: Set up .env file
        script: |
          cat > .env << EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          GOOGLE_MAPS_KEY=$GOOGLE_MAPS_KEY
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          SUPABASE_REDIRECT_URL=$SUPABASE_REDIRECT_URL
          REVERSED_CLIENT_ID=$REVERSED_CLIENT_ID
          EOF

      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up keychain
        script: keychain initialize

      - name: Generate RSA 2048 key for certificate
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048
          openssl req -new \
            -key /tmp/cert_key.pem \
            -out /tmp/cert_request.csr \
            -subj "/CN=Lleva App/O=Jherson Vasquez/C=PE"

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --issuer-id=$APP_STORE_CONNECT_ISSUER_ID \
            --key-id=$APP_STORE_CONNECT_KEY_IDENTIFIER \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up Xcode project signing
        script: xcode-project use-profiles

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --dart-define-from-file=.env \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false