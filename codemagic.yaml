workflows:
  ios-release:
    name: Lleva iOS - TestFlight
    max_build_duration: 60
    environment:
      flutter: 3.38.5
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pe.lleva.app"
        APP_STORE_APPLE_ID: "6817361943"
      groups:
        - Secretas
    scripts:
      - name: Set up .env file
        script: |
          cat > .env << EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          GOOGLE_MAPS_KEY=$GOOGLE_MAPS_KEY
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          SUPABASE_REDIRECT_URL=$SUPABASE_REDIRECT_URL
          REVERSED_CLIENT_ID=$REVERSED_CLIENT_ID
          DEV_MODE=false
          EOF

      - name: Get Flutter packages
        script: flutter pub get

      - name: Set up keychain
        script: keychain initialize

      - name: Generate RSA 2048 key for certificate
        script: |
          openssl genrsa -out /tmp/cert_key.pem 2048

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --issuer-id=$APP_STORE_CONNECT_ISSUER_ID \
            --key-id=$APP_STORE_CONNECT_KEY_IDENTIFIER \
            --create \
            --strict-match-identifier

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up Xcode project signing
        script: xcode-project use-profiles

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Set up GoogleService-Info.plist
        script: |
          # Está en .gitignore: se crea desde la variable secreta (grupo
          # Secretas). Sin ella, FirebaseApp.configure() cerraría la app.
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "Falta la variable GOOGLE_SERVICE_INFO_PLIST" >&2
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
          plutil -lint "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"

      - name: Set up env_defaults.dart
        script: |
          python3 - << 'PYEOF'
          import os
          supabase_url = os.environ["SUPABASE_URL"]
          supabase_anon_key = os.environ["SUPABASE_ANON_KEY"]
          google_web_client_id = os.environ["GOOGLE_WEB_CLIENT_ID"]

          print(f"SUPABASE_URL: {supabase_url[:20]}...")
          print(f"SUPABASE_ANON_KEY: {supabase_anon_key[:20]}...")
          print(f"GOOGLE_WEB_CLIENT_ID: {google_web_client_id[:20]}...")

          content = f"""// Generado por Codemagic — no commitear
          class EnvDefaults {{
            static const supabaseUrl = '{supabase_url}';
            static const supabaseAnonKey = '{supabase_anon_key}';
            static const googleWebClientId = '{google_web_client_id}';
          }}
          """

          path = os.environ["CM_BUILD_DIR"] + "/lib/core/constants/env_defaults.dart"
          with open(path, "w") as f:
              f.write(content)

          print("env_defaults.dart generado:")
          with open(path) as f:
              print(f.read())
          PYEOF

      - name: Flutter build IPA
        script: |
          flutter build ipa \
            --release \
            --dart-define-from-file=.env \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false