name: lleva
description: Aplicación de taxi para Trujillo, Perú - Comisiones justas para conductores
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Gestión de Estado
  flutter_bloc: ^8.1.3
  
  # Navegación
  go_router: ^13.0.0
  
  # Mapas y Geolocalización
  google_maps_flutter: ^2.5.0
  google_maps_flutter_android: ^2.14.0
  google_maps_flutter_platform_interface: ^2.4.0
  geolocator: ^10.1.0
  
  # HTTP Requests
  http: ^1.2.0
  
  # UI Components
  # pinput removido - usando implementación personalizada
  
  # Utilidades
  equatable: ^2.0.5
  get_it: ^8.0.3
  intl: ^0.19.0
  
  # Base de Datos
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.5.4
  image_picker: ^1.1.2
  flutter_polyline_points: ^3.1.0
  rxdart: ^0.28.0

  # Autenticación social
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/map_style.json
